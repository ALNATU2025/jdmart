<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received – JDMart</title>
  <style>
    :root { --blue: #0029A8; --orange: #FB6401; --navy: #142237; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F4F6FA; color: var(--navy);
           min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 20px; padding: 32px 24px; max-width: 420px; text-align: center; box-shadow: 0 4px 24px rgba(20,34,55,.08); }
    .tick { width: 72px; height: 72px; border-radius: 50%; background: #DCFCE7; color: #16A34A; display: grid; place-items: center; font-size: 40px; margin: 0 auto 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6B7385; line-height: 1.5; }
    b { color: var(--blue); }
  </style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Payment complete</h1>
    <p>Thank you! Please <b>return to the JDMart app</b> — your order will be confirmed there in a few seconds.</p>
  </div>
</body>
</html>
