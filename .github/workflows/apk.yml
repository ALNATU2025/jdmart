name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'pubspec.yaml', 'config/**', 'setup.sh', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project, icons, permissions
        run: |
          sed -i 's/^flutter test$/echo "(tests run in the analyze workflow)"/' setup.sh
          bash setup.sh
          if [ -n "${{ secrets.MAPS_ANDROID_KEY }}" ]; then
            sed -i "s/YOUR_MAPS_KEY/${{ secrets.MAPS_ANDROID_KEY }}/" android/app/src/main/AndroidManifest.xml
          fi
          grep -n "uses-permission\|API_KEY\|android:label" android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk jdmart.apk && ls -lh jdmart.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JDMart test build ${{ github.run_number }}
          body: |
            Test APK built from ${{ github.sha }}.
            Install on Android: download jdmart.apk, open it, allow "Install unknown apps" if asked.
          files: jdmart.apk
          make_latest: true
