name: Android emulator smoke test

on:
  push:
    branches: [emu]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: |
          sed -i 's/^flutter test$/echo skip/' setup.sh
          bash setup.sh
      - name: Build release APK for the emulator (x86_64)
        run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p sl.jdmart.jdmart -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > shot1.png
            adb logcat -d > logcat.txt || true
            adb shell input tap 540 2000 || true
            sleep 10
            adb exec-out screencap -p > shot2.png
            adb logcat -d > logcat2.txt || true
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/r
          { echo "commit $GITHUB_SHA"; grep -E "flutter|JDMART|AndroidRuntime|FATAL|Exception|Error|firebase|Firebase" logcat2.txt 2>/dev/null | tail -300; } > /tmp/r/emu.txt
          cp shot1.png /tmp/r/emu1.png 2>/dev/null || true
          cp shot2.png /tmp/r/emu2.png 2>/dev/null || true
          git config user.name ci-bot; git config user.email ci-bot@users.noreply.github.com
          git stash -u >/dev/null 2>&1 || true
          git fetch origin +refs/heads/ci-results:refs/remotes/origin/ci-results
          git checkout -B ci-results origin/ci-results
          cp /tmp/r/* .
          git add emu.txt emu1.png emu2.png 2>/dev/null || git add emu.txt
          git commit -m "Emulator results ${GITHUB_SHA}" || true
          git push origin ci-results
