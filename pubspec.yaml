name: jdmart
description: JDMart - Sierra Leone's marketplace. Buy Smart. Sell Faster.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase (FlutterFire). If `flutter pub get` reports a version conflict,
  # run: flutter pub upgrade --major-versions
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_storage: ^14.0.0
  firebase_messaging: ^17.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  file_picker: ^10.0.0
  google_maps_flutter: ^2.10.0
  geolocator: '>=13.0.0 <15.0.0'
  web: ^1.1.0
  intl: '>=0.19.0 <0.21.0'
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

# The newest Android versions of these plugins call Kotlin through JNI and crash
# on start in release builds ("Didn't find class kotlin/Result"). Use the
# previous, stable implementations until that is fixed upstream.
dependency_overrides:
  shared_preferences_android: '>=2.4.0 <2.5.0'
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_mark.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo_mark_transparent.png

# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo_mark_transparent.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_mark_transparent.png
